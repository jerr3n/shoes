name: CI
on: [push, pull_request]

jobs:
  lint: #not my compute hours!
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up golang tooling
        uses: actions/setup-go@v5
        with: 
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          # rokit.toml lives in roblox/, not the repo root; without this the
          # action finds no manifest and installs none of the tools.
          path: roblox
      
      - name: Set up wally
        run: wally install
        working-directory: roblox

      - name: Stylua
        run: stylua --check src
        working-directory: roblox
      
      - name: Selene
        run: selene src
        working-directory: roblox

      - name: Golang linting
        run: go vet ./...
        working-directory: backend

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up golang tooling
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          path: roblox

      - name: Set up wally
        run: wally install
        working-directory: roblox

      - name: Build linux-amd64
        run: make build-plat-linux-amd64
      - name: Build linux-arm64
        run: make build-plat-linux-arm64
      - name: Build darwin-amd64
        run: make build-plat-darwin-amd64
      - name: Build darwin-arm64
        run: make build-plat-darwin-arm64
      - name: Build windows-amd64
        run: make build-plat-windows-amd64
      - name: Build windows-arm64
        run: make build-plat-windows-arm64

      - name: Build rojo
        run: make build-rojo
      - name: Upload linux-amd64
        uses: actions/upload-artifact@v4
        with:
          name: shoes-linux-amd64
          path: out/linux-amd64

      - name: Upload linux-arm64
        uses: actions/upload-artifact@v4
        with:
          name: shoes-linux-arm64
          path: out/linux-arm64

      - name: Upload darwin-amd64
        uses: actions/upload-artifact@v4
        with:
          name: shoes-darwin-amd64
          path: out/darwin-amd64

      - name: Upload darwin-arm64
        uses: actions/upload-artifact@v4
        with:
          name: shoes-darwin-arm64
          path: out/darwin-arm64

      - name: Upload windows-amd64
        uses: actions/upload-artifact@v4
        with:
          name: shoes-windows-amd64
          path: out/windows-amd64.exe

      - name: Upload windows-arm64
        uses: actions/upload-artifact@v4
        with:
          name: shoes-windows-arm64
          path: out/windows-arm64.exe
      - name: Upload model file
        uses: actions/upload-artifact@v4
        with:
          name: model.rbxmx
          path: out/shoes.rbxmx
          
  crossplatform:
    steps:
      - name: Build linux-amd64
        run: make build-plat-linux-amd64
      - name: Build linux-arm64
        run: make build-plat-linux-arm64
      - name: Build darwin-amd64
        run: make build-plat-darwin-amd64
      - name: Build darwin-arm64
        run: make build-plat-darwin-arm64
      - name: Build windows-amd64
        run: make build-plat-windows-amd64
      - name: Build windows-arm64
        run: make build-plat-windows-arm64